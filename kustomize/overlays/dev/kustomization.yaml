# Q197-Q198 : environnement dev (1 replica(s) frontend et API)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-dev
resources:
  - ../../base
replicas:
  - name: frontend
    count: 1
  - name: api
    count: 1
patches:
  - target:
      kind: ConfigMap
      name: portfolio-config
    patch: |-
      - op: replace
        path: /data/API_URL
        value: http://api.portfolio-dev.svc.cluster.local:4000
      - op: replace
        path: /data/CORS_ORIGIN
        value: https://dev.portfolio.local
