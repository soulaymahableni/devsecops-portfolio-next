# Q205-Q206 : Argo CD deploie automatiquement la branche gitops (environnement dev)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/soulaymahableni/devsecops-portfolio-next.git
    targetRevision: gitops
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        verify-images: enabled
