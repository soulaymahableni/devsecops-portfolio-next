# Q140 : Deployment de l'API Express (Q149 : ConfigMap + Secret)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: portfolio
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: devsecops-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: CORS_ORIGIN
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: POSTGRES_HOST
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secret
                  key: POSTGRES_PASSWORD
            # $(VAR) : Kubernetes remplace par les variables définies plus haut
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)?schema=public
