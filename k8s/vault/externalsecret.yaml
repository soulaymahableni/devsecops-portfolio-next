apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-from-vault
  namespace: eso-demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: db-secret
  data:
    - secretKey: password
      remoteRef:
        key: portfolio/db
        property: password
