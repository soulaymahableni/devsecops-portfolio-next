# Q247 : analyse Prometheus. Si le taux d'erreurs 5xx depasse 5 %, la progression Canary est annulee (rollback automatique).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: taux-erreurs-5xx
spec:
  args:
    - name: namespace
  metrics:
    - name: erreurs-5xx
      interval: 30s
      count: 4
      failureLimit: 1
      # pas de trafic (aucune requete) : on considere l'analyse comme reussie
      successCondition: result[0] < 0.05
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            (sum(rate(http_requests_total{namespace="{{args.namespace}}",status=~"5.."}[2m])) or vector(0))
            /
            (sum(rate(http_requests_total{namespace="{{args.namespace}}"}[2m])) > 0 or vector(1))
