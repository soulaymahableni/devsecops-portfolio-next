# Q151/Q152 : accès au portfolio par un nom local (Traefik, fourni par K3s)
# Q155 : HTTPS avec le certificat émis par cert-manager, redirection HTTP -> HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: portfolio
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Entrée HTTP (port 80) : redirige tout vers HTTPS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-http
  namespace: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: portfolio-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: portfolio.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
# Entrée HTTPS (port 443)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - portfolio.local
      secretName: portfolio-tls
  rules:
    - host: portfolio.local
      http:
        paths:
          # le formulaire de contact passe par la route Next.js, qui appelle l'API
          - path: /api/contact
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          # Q152 : portfolio.local/api -> API Express
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          # Q151 : tout le reste -> frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
