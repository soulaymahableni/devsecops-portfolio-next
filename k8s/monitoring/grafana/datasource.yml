apiVersion: 1
datasources:
  - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://localhost:30090", isDefault: true}
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{namespace=~"portfolio-.*"} |= "$${__trace.traceId}"'
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      maxLines: 500
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: Voir la trace
        - name: RequestID
          matcherRegex: '"requestId":"([\w-]+)"'
          url: '{namespace=~"portfolio-.*"} |= "$${__value.raw}"'
          datasourceUid: loki
          urlDisplayLabel: Logs de la meme requete
