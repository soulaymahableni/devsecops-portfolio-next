---
- name: Installer K3s
  when: k3s_state == 'present'
  block:
    - name: Installer les prérequis
      ansible.builtin.apt:
        name: [curl, ca-certificates]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Télécharger le script d'installation officiel
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Installer K3s (version figée)
      ansible.builtin.command: /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "{{ k3s_exec }}"

    - name: S'assurer que le service k3s tourne
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true

    - name: Attendre que le noeud soit Ready
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: nodes
      retries: 30
      delay: 5
      until: nodes.rc == 0 and ' Ready' in nodes.stdout
      changed_when: false

    - name: Afficher l'état du cluster
      ansible.builtin.debug:
        msg: "{{ nodes.stdout_lines }}"

- name: Désinstaller K3s
  when: k3s_state == 'absent'
  block:
    - name: Chercher le script de désinstallation
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: uninstall

    - name: Désinstaller K3s (supprime le cluster et ses données)
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      when: uninstall.stat.exists
      changed_when: true
