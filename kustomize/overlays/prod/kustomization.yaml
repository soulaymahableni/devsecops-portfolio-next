# Q197-Q198 : environnement prod (3 replica(s) frontend et API)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-prod
resources:
  - ../../base
replicas:
  - name: frontend
    count: 3
  - name: api
    count: 3
patches:
  - target:
      kind: ConfigMap
      name: portfolio-config
    patch: |-
      - op: replace
        path: /data/API_URL
        value: http://api.portfolio-prod.svc.cluster.local:4000
      - op: replace
        path: /data/CORS_ORIGIN
        value: https://prod.portfolio.local
