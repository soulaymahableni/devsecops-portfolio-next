# Q140 : Deployment de l'API Express
# Q149 : ConfigMap + Secret ; Q157-Q159 : probes de santé, requests et limits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: portfolio
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: devsecops-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: CORS_ORIGIN
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: POSTGRES_HOST
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: portfolio-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)?schema=public
          # Q156 : /api/health sert de base aux sondes
          # Démarrage : laisse le temps à la migration Prisma (jusqu'à 60 s)
          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 2
            failureThreshold: 30
          # Q157 : le pod ne reçoit du trafic que lorsque l'API répond
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Q158 : redémarrage automatique si l'API ne répond plus
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Q159 : ressources
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
