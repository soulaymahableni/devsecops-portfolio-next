---
- name: Cloner (ou mettre à jour) le Portfolio
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: main
    force: true

- name: Construire et démarrer les conteneurs
  ansible.builtin.command: docker compose up -d --build
  args:
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Attendre que le Portfolio réponde sur le port 3000
  ansible.builtin.uri:
    url: http://localhost:3000
    status_code: 200
  register: portfolio
  retries: 30
  delay: 5
  until: portfolio.status == 200

- name: Afficher l'état des conteneurs
  ansible.builtin.command: docker compose ps
  args:
    chdir: "{{ app_dir }}"
  register: ps
  changed_when: false

- name: Résultat
  ansible.builtin.debug:
    var: ps.stdout_lines
