name: CI DevSecOps

on:
  push:
    branches: [main]
  pull_request:

# Q76 : permissions minimales pour le GITHUB_TOKEN
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Q70 : tests API
  tests-api:
    runs-on: ubuntu-latest
    steps:
      # Q77 : actions épinglées par SHA de commit (v4.3.1)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests API
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npm test

  # Q116 : tests d'intégration avec Floci (AWS émulé), sans compte AWS
  tests-integration-floci:
    runs-on: ubuntu-latest
    services:
      floci:
        # Floci v2.4.0, épinglé par empreinte (comme les actions, voir Q77)
        image: floci/floci@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
        ports:
          - 4566:4566
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Attendre Floci
        run: curl -sf --retry 30 --retry-connrefused --retry-delay 2 http://localhost:4566/_floci/health > /dev/null
      - name: Tests d'intégration (S3 + SQS)
        working-directory: api
        run: |
          npm ci
          npm run test:integration

  # Q70 : tests frontend
  tests-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests frontend
        run: |
          npm ci
          npm test

  # Q71 : scan des secrets
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/src" zricethezav/gitleaks:latest \
            detect --source /src --no-git --redact --exit-code 1

  # Q71 : SAST
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config auto --error \
            --exclude node_modules --exclude .next .

  # Q71 : contrôle des dépendances
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (frontend)
        run: npm audit --audit-level=critical
      - name: npm audit (API)
        working-directory: api
        run: npm audit --audit-level=critical

  # Q72 et Q73 : build des images puis scan Trivy
  images:
    runs-on: ubuntu-latest
    needs: [tests-api, tests-frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build des images
        run: |
          SHA=${GITHUB_SHA::7}
          docker build -t devsecops-portfolio:$SHA .
          docker build -t devsecops-api:$SHA ./api
          docker images | grep "$SHA"
      - name: Scan Trivy (CRITICAL bloquant)
        run: |
          SHA=${GITHUB_SHA::7}
          for img in devsecops-portfolio devsecops-api; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --scanners vuln \
              --severity CRITICAL --exit-code 1 $img:$SHA
          done
