---
# Q146 : déploie le portfolio dans K3s (images + manifests) après (re)création du cluster
- name: Déployer le portfolio dans K3s
  hosts: k3s_servers
  gather_facts: false

  vars:
    repo_dir: "{{ lookup('env', 'HOME') }}/devsecops-portfolio-next"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    images:
      - devsecops-api:1.0
      - devsecops-portfolio:1.0
      - postgres:16-alpine

  tasks:
    - name: Importer les images Docker locales dans containerd (K3s n'utilise pas Docker)
      ansible.builtin.shell: "docker save {{ images | join(' ') }} | k3s ctr images import -"
      become: true
      changed_when: true

    - name: Appliquer les manifests Kubernetes
      ansible.builtin.command: kubectl apply -f {{ repo_dir }}/k8s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      changed_when: true

    - name: Attendre que chaque Deployment soit prêt
      ansible.builtin.command: kubectl rollout status deploy/{{ item }} -n portfolio --timeout=240s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      loop: [postgres, api, frontend]
      changed_when: false

    - name: Vérifier que le frontend répond (NodePort 30080)
      ansible.builtin.uri:
        url: http://localhost:30080/
        status_code: 200
      register: front
      retries: 12
      delay: 5
      until: front.status == 200
