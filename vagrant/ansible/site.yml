---
- name: Installer Docker puis déployer le DevSecOps Portfolio
  hosts: all
  connection: local
  become: true
  gather_facts: true

  vars:
    docker_user: vagrant
    repo_url: "https://github.com/soulaymahableni/devsecops-portfolio-next.git"
    app_dir: /opt/portfolio

  roles:
    - docker_install
    - portfolio_deploy
