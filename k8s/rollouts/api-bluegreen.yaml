# Q244 : Blue/Green. La nouvelle version (green) tourne a cote de l'ancienne (blue), est testee par
# le service de previsualisation, puis le trafic bascule d'un coup a la promotion.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-bluegreen
  namespace: portfolio-dev
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: api-bg}
  strategy:
    blueGreen:
      activeService: api-bluegreen-active
      previewService: api-bluegreen-preview
      autoPromotionEnabled: false
  template:
    metadata:
      labels: {app: api-bg}
    spec:
      serviceAccountName: portfolio-app
      imagePullSecrets: [{name: harbor-pull}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: 192.168.190.141:8085/portfolio/devsecops-api:1.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          ports: [{containerPort: 4000}]
          env:
            - name: DEPLOY_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              valueFrom:
                configMapKeyRef: {name: portfolio-config, key: PORT}
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef: {name: portfolio-config, key: CORS_ORIGIN}
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: {name: portfolio-config, key: POSTGRES_HOST}
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: {name: portfolio-config, key: POSTGRES_USER}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: portfolio-config, key: POSTGRES_DB}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: portfolio-secret, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)?schema=public
          startupProbe:
            httpGet: {path: /api/health, port: 4000}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/health, port: 4000}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api-bluegreen-active, namespace: portfolio-dev}
spec:
  selector: {app: api-bg}
  ports: [{port: 4000, targetPort: 4000}]
---
apiVersion: v1
kind: Service
metadata: {name: api-bluegreen-preview, namespace: portfolio-dev}
spec:
  selector: {app: api-bg}
  ports: [{port: 4000, targetPort: 4000}]
