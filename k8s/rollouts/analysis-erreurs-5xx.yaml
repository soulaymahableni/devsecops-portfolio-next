# Q247 : analyse Prometheus. Si le taux d'erreurs 5xx depasse le seuil, la progression Canary est annulee (rollback automatique).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: taux-erreurs-5xx
spec:
  args:
    - name: namespace
    - name: seuil
      value: "0.05"
  metrics:
    - name: erreurs-5xx
      interval: 20s
      count: 3
      failureLimit: 0
      successCondition: result[0] < {{args.seuil}}
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            (sum(rate(http_requests_total{namespace="{{args.namespace}}",status=~"5.."}[1m])) or vector(0))
            /
            (sum(rate(http_requests_total{namespace="{{args.namespace}}"}[1m])) > 0 or vector(1))
