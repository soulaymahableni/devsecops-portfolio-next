apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sdisallowlatesttag
spec:
  crd:
    spec:
      names:
        kind: K8sDisallowLatestTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sdisallowlatesttag

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("conteneur %v : l'image %v utilise :latest", [c.name, c.image])
        }

        violation[{"msg": msg}] {
          c := input.review.object.spec.containers[_]
          parts := split(c.image, "/")
          last := parts[count(parts) - 1]
          not contains(last, ":")
          not contains(last, "@")
          msg := sprintf("conteneur %v : l'image %v n'a pas de tag (latest implicite)", [c.name, c.image])
        }
